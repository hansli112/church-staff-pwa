<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="教會同工全方位助手">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="竹圍靈糧福音中心">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>竹圍靈糧福音中心</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Remove the browser focus ring on Flutter's HTML text editing element. */
    .flt-text-editing,
    .flt-text-editing * {
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      border: none !important;
      background: transparent !important;
      color: transparent !important;
      caret-color: transparent;
    }

    .flt-text-editing:focus,
    .flt-text-editing:focus-within,
    .flt-text-editing textarea:focus,
    .flt-text-editing input:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    /* 對齊 Flutter MaterialApp 內 _AuthRestoringShell 的視覺：
       headlineMedium 標題 + 8px gap + titleMedium 副標 + 32px gap + 28px spinner。
       overlay 移除時跟 Flutter shell 幾乎無感過渡。 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #1f2937;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      z-index: 9999;
    }

    #app-loading .title {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
    }

    #app-loading .subtitle {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 400;
      color: rgba(31, 41, 55, 0.7);
      text-align: center;
      line-height: 1.5;
    }

    #app-loading .spinner {
      margin-top: 32px;
      width: 28px;
      height: 28px;
      border: 3px solid #d1d5db;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="title">竹圍靈糧福音中心</div>
    <div class="subtitle">服事小幫手</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    function hideLoadingScreen() {
      const loading = document.getElementById('app-loading');
      if (loading) {
        loading.remove();
      }
    }

    window.addEventListener('flutter-first-frame', hideLoadingScreen);

    if ('serviceWorker' in navigator) {
      // 第一次裝 SW 時，瀏覽器會把 controller 從 null 切到新 SW，
      // 也會觸發 controllerchange。若無條件 reload，使用者第一次造訪
      // 就會看到「載入中」兩次（reload 把載入流程打掉重來）。
      // 只在已經有 controller 時的「升級」情境才 reload。
      var hadInitialController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadInitialController) {
          hadInitialController = true;
          return;
        }
        window.location.reload();
      });

      // 註冊我們自己的 cache-first SW（Flutter 3.27+ 內建 flutter_service_worker.js
      // 是自我登出型的，沒有 caching；不再使用）。
      // SW 升級流程刻意不更動 loading 訊息：每次 deploy cache_sw.js 都
      // 產生新 bytes，使用者每次 refresh 都會偵測到 updatefound，若每次都
      // 改文字就會看到「載入中」下方訊息一直跳。讓升級在背景靜默進行，
      // 直到 controllerchange 才 reload 一次。
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('cache_sw.js')
          .then(function (registration) {
            registration.update();

            registration.addEventListener('updatefound', function () {
              const newWorker = registration.installing;
              if (!newWorker) return;

              newWorker.addEventListener('statechange', function () {
                // 只在升級情境（已有 controller）才告訴新 SW 跳過 waiting，
                // 觸發 controllerchange 進而 reload 套用新版。首次安裝
                // 會自然 activate，無需介入。
                if (
                  newWorker.state === 'installed' &&
                  navigator.serviceWorker.controller
                ) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch(function (error) {
            console.error('Cache SW registration failed:', error);
          });

        // Firebase Cloud Messaging 推播 SW 走自己的 scope。
        navigator.serviceWorker
          .register('firebase-messaging-sw.js', {
            scope: 'firebase-cloud-messaging-push-scope',
          })
          .catch(function (error) {
            console.error('Firebase messaging SW registration failed:', error);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
