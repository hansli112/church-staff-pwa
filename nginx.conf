server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js 未壓縮是 3 MB。nginx 官方 image 預設沒開 gzip，
    # 自架這條路線等於整包原始大小傳給使用者（Cloudflare Pages 那條會自動壓）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # 基本安全標頭（CSP 故意不設，Flutter web + CanvasKit + Firebase 容易誤擋整站）
    # nginx 的 add_header 繼承在 location 自己有 add_header 時會失效，
    # 因此 HTML-serving location 內也重複一份
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 入口檔與 Service Worker 不可長快取，避免卡在舊版
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /cache_sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 沒有這條 exact match 的話會落到下面的 \.js$ 規則吃到 expires 6M，
    # 推播 SW 就會卡在半年前的版本（web/_headers 那邊本來就有列，兩邊要一致）
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /assets/AssetManifest.bin.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /assets/FontManifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Flutter web 的產物幾乎都「不帶 hash」：URL 固定，內容每次 build 都可能變。
    # 這類路徑絕對不能吃到下面 \.js$ 的 expires 6M，否則瀏覽器的 HTTP cache 會
    # 在部署之後繼續端出舊 bytes —— 連 service worker 自己 fetch 回填時拿到的
    # 都是舊的，等於新版 SW 把舊資產再快取一次，使用者卡在舊版半年。
    #
    #   /canvaskit/  升 Flutter 才會變。舊的 canvaskit.js 配新的 canvaskit.wasm
    #                版本對不起來就是白畫面（.wasm 不在那條 regex 裡，兩者失效
    #                時機原本就不一致）。失效交給 cache_sw.js 的 vendor cache 管。
    #   /assets/     每次 deploy 都可能變（圖片、字型、AssetManifest）。
    #
    # 兩者都改成只做 revalidate：Cloudflare Pages 對這些路徑的預設行為就是這樣，
    # 兩條部署路徑要一致。SW 命中時根本不會發請求，revalidate 的成本是每次
    # 部署每個檔案一次 304，很便宜。
    # ^~ 讓這兩條前綴贏過下面的 regex location。
    location ^~ /canvaskit/ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location ^~ /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 處理靜態資源緩存（favicon、icons/ 這類真正不會變的才適用 6M）
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # SPA 路由核心配置：任何找不到的路徑都導向 index.html
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # 錯誤頁面處理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
