server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js 未壓縮是 3 MB。nginx 官方 image 預設沒開 gzip，
    # 自架這條路線等於整包原始大小傳給使用者（Cloudflare Pages 那條會自動壓）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # 基本安全標頭（CSP 故意不設，Flutter web + CanvasKit + Firebase 容易誤擋整站）
    # nginx 的 add_header 繼承在 location 自己有 add_header 時會失效，
    # 因此 HTML-serving location 內也重複一份
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 入口檔與 Service Worker 不可長快取，避免卡在舊版
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /cache_sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 沒有這條 exact match 的話會落到下面的 \.js$ 規則吃到 expires 6M，
    # 推播 SW 就會卡在半年前的版本（web/_headers 那邊本來就有列，兩邊要一致）
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /assets/AssetManifest.bin.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /assets/FontManifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 處理靜態資源緩存
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # SPA 路由核心配置：任何找不到的路徑都導向 index.html
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # 錯誤頁面處理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
