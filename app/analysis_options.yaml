include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Flutter 3.50 deprecates package:flutter/material.dart for material_ui
    # and more, but the store builds' patches still build on 3.41
    # (Shorebird keeps a release's Flutter), which has none of the
    # replacements. Move to them with the first release built on 3.50.
    deprecated_member_use: ignore
  exclude:
    - lib/l10n/app_localizations*.dart
    # Generated by tool/budoux_models.dart.
    - lib/core/design/phrase_models.dart
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - avoid_print
    - unawaited_futures
    - require_trailing_commas

formatter:
  page_width: 120
  trailing_commas: preserve
