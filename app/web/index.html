<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Phone-sized from the start, so the loading screen is not drawn at a
       desktop's width and shrunk. Flutter puts in this same one later. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="馬大！馬大！你為許多的事思慮煩擾，但是不可少的只有一件；馬利亞已經選擇那上好的福分，是不能奪去的。（路加福音 10:41–42）">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="馬大別忙">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>馬大別忙</title>
  <link rel="manifest" href="manifest.json">
  <!-- The fonts for Chinese text download from here as the app starts
       (lib/core/fonts.dart). -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- The loading screen: a first visit downloads a few MB before the app
       draws anything. The app removes it once past its own loading page;
       the server fills in the church, or the invite (churchPage.ts). -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
      background: #F2F2F7; color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    #splash img { width: 72px; height: 72px; border-radius: 16px; }
    #splash p { margin: 0; max-width: 320px; }
    #splash .title { font-size: 22px; font-weight: 700; line-height: 1.3; }
    #splash .note { font-size: 15px; line-height: 1.5; color: #5C5C62; }
    #splash .spin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid #D1D1D6; border-top-color: #1F5FD1;
      animation: splash-spin 0.9s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      #splash { background: #000; color: #fff; }
      #splash .note { color: #AEAEB2; }
      #splash .spin { border-color: #38383A; border-top-color: #6EA2FF; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .spin { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash" role="status"><!--splash--><img src="icons/Icon-192.png" alt=""><p class="title">馬大別忙</p><div class="spin" aria-hidden="true"></div><p class="note">載入中…</p><!--/splash--></div>
  <script>
    // Should the app never take it down, it must not cover the app for good.
    window.addEventListener('flutter-first-frame', function () {
      setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 20000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
