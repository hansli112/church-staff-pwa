name: martha-ci

on:
  push:
    branches: [martha-main]
  pull_request:
    branches: [martha-main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: scripts/check.sh app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: cd functions && npm ci
      - run: cd firestore-tests && npm ci
      - run: scripts/check.sh functions
      - run: scripts/check.sh rules
