name: martha-ci

on:
  push:
    branches: [martha-main]
  pull_request:
    branches: [martha-main]

# Pinned rather than ubuntu-latest, so a new runner image (Ubuntu 26 from
# 2026-10-19) is a change made here, not one that breaks CI by itself.
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: scripts/check.sh app

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: cd functions && npm ci
      - run: cd firestore-tests && npm ci
      - run: scripts/check.sh functions
      - run: scripts/check.sh rules

  # The Backend contract (app/test/contract) on FirebaseBackend: the
  # emulators with the built functions, the tests in Chrome.
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: cd functions && npm ci
      - run: scripts/check.sh contract
