name: martha-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned rather than ubuntu-latest, so a new runner image (Ubuntu 26 from
# 2026-10-19) is a change made here, not one that breaks CI by itself.
jobs:
  # The app's tests take about five minutes in one job, so they run as three
  # shards side by side.
  app:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      TEST_SHARDS: 3
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: scripts/check.sh app

  # The store builds' patches build on the Flutter each release was built
  # with (Shorebird keeps it): 1.0.5 on 3.41.0, 1.0.6 on 3.41.9. The app
  # must still compile there until every store build is on 3.50.
  store-flutter:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.0', '3.41.9']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: cd app && flutter pub get && flutter gen-l10n && flutter analyze --no-fatal-infos --no-fatal-warnings lib

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: cd functions && npm ci
      - run: cd firestore-tests && npm ci
      - run: scripts/check.sh functions
      - run: scripts/check.sh rules

  # The Backend contract (app/test/contract) on FirebaseBackend: the
  # emulators with the built functions, the tests in Chrome.
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: cd functions && npm ci
      - run: scripts/check.sh contract
