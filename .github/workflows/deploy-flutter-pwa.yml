name: Deploy Flutter PWA
on:
  push:
    branches: [ main, dev ] # 當你 push 到 main 或 dev 時會觸發
  workflow_dispatch: # 允許手動觸發

env:
  # 同時給 flutter-action 與 cache_sw.js 的 VENDOR_VERSION 使用。
  # 改這個版本號 = 讓使用者重新下載 canvaskit 引擎，其餘 deploy 都不會。
  FLUTTER_VERSION: '3.41.0'

jobs:
  # firestore.rules 是「繞過 App 直接打 Firestore」時唯一的防線，所以規則
  # 有自己的一套 emulator 測試。刻意不擋 build-and-deploy：規則不在前端的
  # 部署產物裡（要另外 firebase deploy --only firestore:rules），把兩件事綁
  # 在一起只會讓前端部署平白變慢。測試紅了照樣看得見。
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - run: npm ci
        working-directory: firestore-tests

      - name: Test firestore.rules against the emulator
        run: npm test
        working-directory: firestore-tests

  # functions/ 寫入 Google Calendar，是唯一一段跑在伺服器、拿得到 service
  # account 憑證的程式碼。它跟前端在同一次 pages deploy 上去，所以這個 job
  # 刻意「擋」build-and-deploy —— 跟 firestore-rules 不同，那份規則要另外
  # firebase deploy，綁在一起只會平白拖慢前端部署。
  # 沒有相依套件，所以不用 npm ci，也就沒有 lockfile 可以 cache。
  functions-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the calendar write API
        run: npm test
        working-directory: functions-tests

  build-and-deploy:
    needs: functions-tests
    runs-on: ubuntu-latest
    steps:
      # 1. 檢出程式碼
      - uses: actions/checkout@v7

      # 2. 安裝 Flutter 環境 (GitHub 支援，Cloudflare 不支援)
      # 版本固定：跟著 stable 浮動的話，某天 Flutter 發版就可能無預警 build 壞掉。
      # 升級時手動改這個號碼，並在本機先跑過 flutter analyze / flutter test。
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 3. 取得 Flutter 套件
      - run: flutter pub get

      # 4. 品質關卡：analyze / test 沒過就不部署
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 5. 編譯 Web (根據分支區分環境)
      - name: Build Web
        env:
          # Secrets (sensitive)
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          # Variables (non-sensitive, visible in repo settings)
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
        run: |
          set -eo pipefail
          if [ -z "$FCM_WEB_VAPID_KEY" ]; then
            echo "::warning::Missing FCM_WEB_VAPID_KEY secret. Web push token will not be generated."
          fi
          # Firebase.initializeApp 少任何一個必填欄位，App 在瀏覽器裡就初始化
          # 不了 —— 而且 build 會成功，要部署完打開才發現。只擋 API key 不夠。
          # 這份清單刻意與 Dockerfile 的檢查一致：兩條部署路徑不能一邊擋、
          # 一邊放行，否則自架版與 CI 版會編出行為不同的產物。
          for required in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID \
                          FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing $required. Build would produce a non-functional app."
              exit 1
            fi
          done
          DART_DEFINES=(
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_MEASUREMENT_ID="$FIREBASE_MEASUREMENT_ID"
            --dart-define=GOOGLE_CALENDAR_API_KEY="$GOOGLE_CALENDAR_API_KEY"
            --dart-define=GOOGLE_CALENDAR_ID="$GOOGLE_CALENDAR_ID"
          )
          mkdir -p web
          # 這裡刻意讀 runner 內建的環境變數，而不是用 GitHub 的表示式插值。
          # 表示式是在 shell 啟動「之前」把值直接貼成腳本文字，分支名帶了 shell
          # 特殊字元（workflow_dispatch 可以從任意分支觸發）就會被當成指令執行，
          # 帶了引號也會把 JSON 寫壞。
          #
          # 註：這段註解本身不能寫出表示式的雙大括號語法 —— GitHub 會掃描整個
          # 檔案（包含 run: 區塊內部）去解析表示式，空的一組就是語法錯誤，
          # 整份 workflow 會載入失敗、零個 job 執行。
          cat <<EOF > web/version.json
          {
            "version": "$GITHUB_SHA",
            "build_number": "$GITHUB_RUN_NUMBER",
            "branch": "$GITHUB_REF_NAME",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          # --no-web-resources-cdn：把 CanvasKit 放進自己的 build/web/canvaskit/。
          # 預設會從 www.gstatic.com 載入，那條路徑 service worker 不能快取
          # （gstatic.com 在 never-cache 名單裡），cache_sw.js 的 vendor cache
          # 也就永遠不會命中。改成自家來源後引擎才真的能離線與跨 deploy 重用。
          #
          # 這裡刻意「不」加 --wasm。瓶頸雖然確實在 UI thread（執行 Dart 本身），
          # 但 Flutter 的 wasm 版在 iOS 上根本跑不起來：Safari 18.2 起雖已支援
          # WasmGC，WebKit 仍有一個 bug 擋住 Flutter 的 wasm 渲染器
          # （https://bugs.webkit.org/show_bug.cgi?id=267291），而 iOS 上所有
          # 瀏覽器都被規定使用 WebKit，換 Chrome 也一樣。實測 HUD 顯示 iPhone
          # 上落回 JS 版，證實了這點。我們的使用者以 iPhone 為主，加了只會讓
          # artifact 變兩份、CI 變慢，卻換不到任何東西。
          # 上游修好之後把 --wasm 加回來即可（?perf=1 的 HUD 會顯示 WASM/JS）。
          flutter build web --release --base-href "/" --no-web-resources-cdn "${DART_DEFINES[@]}"

      # 6. 將版本號注入 cache_sw.js
      # BUILD_VERSION（每次 deploy 都不同）→ App 資產 cache，確保使用者
      #   下一次 reload 不會卡在舊的 main.dart.js。
      # VENDOR_VERSION（只跟 Flutter 版本走）→ canvaskit 等引擎資產 cache，
      #   讓 7 MB 的 canvaskit.wasm 不會每次 deploy 都被清掉重下載。
      # fail-fast 防止 placeholder 已被替換或不存在時 silently no-op。
      - name: Inject cache versions into cache_sw.js
        run: |
          set -euo pipefail
          for placeholder in __BUILD_VERSION__ __VENDOR_VERSION__; do
            if ! grep -q "$placeholder" build/web/cache_sw.js; then
              echo "::error::$placeholder placeholder not found in build/web/cache_sw.js"
              exit 1
            fi
          done
          BUILD_VERSION="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          VENDOR_VERSION="flutter-${FLUTTER_VERSION}"
          sed -i \
            -e "s|__BUILD_VERSION__|${BUILD_VERSION}|g" \
            -e "s|__VENDOR_VERSION__|${VENDOR_VERSION}|g" \
            build/web/cache_sw.js
          for expected in "${BUILD_VERSION}" "${VENDOR_VERSION}"; do
            if ! grep -q "${expected}" build/web/cache_sw.js; then
              echo "::error::sed substitution did not produce ${expected}"
              exit 1
            fi
          done

      # 7. 將 Firebase 設定注入 messaging service worker
      # 同樣要 fail-fast。這支 SW 的失敗特別安靜：placeholder 改名或 sed 沒對到
      # 時 workflow 照樣全綠、App 也照常開，只是 initializeApp 拿到字面上的
      # '__FIREBASE_API_KEY__'，背景推播整個死掉 —— 要等到真的推一則通知沒收到
      # 才會有人發現。cache_sw.js 那步早就有這層保護，這裡不能少。
      - name: Inject Firebase config into service worker
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          SW=build/web/firebase-messaging-sw.js
          for placeholder in __FIREBASE_API_KEY__ __FIREBASE_AUTH_DOMAIN__ \
                             __FIREBASE_PROJECT_ID__ __FIREBASE_STORAGE_BUCKET__ \
                             __FIREBASE_MESSAGING_SENDER_ID__ __FIREBASE_APP_ID__ \
                             __FIREBASE_MEASUREMENT_ID__; do
            if ! grep -q "$placeholder" "$SW"; then
              echo "::error::$placeholder placeholder not found in $SW"
              exit 1
            fi
          done
          sed -i \
            -e "s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|g" \
            -e "s|__FIREBASE_AUTH_DOMAIN__|$FIREBASE_AUTH_DOMAIN|g" \
            -e "s|__FIREBASE_PROJECT_ID__|$FIREBASE_PROJECT_ID|g" \
            -e "s|__FIREBASE_STORAGE_BUCKET__|$FIREBASE_STORAGE_BUCKET|g" \
            -e "s|__FIREBASE_MESSAGING_SENDER_ID__|$FIREBASE_MESSAGING_SENDER_ID|g" \
            -e "s|__FIREBASE_APP_ID__|$FIREBASE_APP_ID|g" \
            -e "s|__FIREBASE_MEASUREMENT_ID__|$FIREBASE_MEASUREMENT_ID|g" \
            "$SW"
          # 收尾再掃一次。上面逐一比對的是「替換前有沒有」，這條抓的是「替換後
          # 還有沒有殘留」—— 例如日後多加一個欄位卻忘了補 sed 規則。
          # 印出來的是「沒被替換掉」的那幾行，內容就是 placeholder 本身，不會外洩設定值。
          if grep -n '__FIREBASE_[A-Z_]*__' "$SW"; then
            echo "::error::Placeholders remain in $SW after substitution"
            exit 1
          fi

      # 8. 部署到 Cloudflare Pages
      # cloudflare/pages-action@v1 已被官方 deprecate（repo 已封存），
      # 改用 wrangler-action 跑 `pages deploy`。API token 權限需求相同
      # （Cloudflare Pages: Edit）。
      # 關鍵：推送到 main 會更新 Production，推送到 dev 會產生 Preview 網址
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/web
            --project-name=church-staff-pwa
            --branch=${{ github.ref_name }}
